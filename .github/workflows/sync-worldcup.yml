name: Sync World Cup Data

on:
  schedule:
    - cron: '*/20 11-23 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch data from football-data.org
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: |
          echo "Fetching finished matches..."
          curl -s -H "X-Auth-Token: ${API_KEY}" \
            "https://api.football-data.org/v4/competitions/WC/matches?status=FINISHED" \
            -o /tmp/matches.json

          echo "Fetching top scorers..."
          curl -s -H "X-Auth-Token: ${API_KEY}" \
            "https://api.football-data.org/v4/competitions/WC/scorers?limit=50" \
            -o /tmp/scorers.json

          echo "Fetching team names..."
          curl -s -H "X-Auth-Token: ${API_KEY}" \
            "https://api.football-data.org/v4/competitions/WC/teams" \
            -o /tmp/teams.json

          echo "--- Response previews ---"
          python3 -c "import json; d=json.load(open('/tmp/matches.json')); print('matches:', len(d.get('matches',[])), '| msg:', d.get('message','ok'))"
          python3 -c "import json; d=json.load(open('/tmp/scorers.json')); print('scorers:', len(d.get('scorers',[])), '| msg:', d.get('message','ok'))"
          python3 -c "import json; d=json.load(open('/tmp/teams.json'));   print('teams:  ', len(d.get('teams',[])),   '| msg:', d.get('message','ok'))"

      - name: Process data into CSVs
        run: python3 sweepstake/data/process_api.py

      - name: Commit if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sweepstake/data/results.csv \
                  sweepstake/data/topscorers.csv \
                  sweepstake/data/teams.csv

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            MATCHES=$(tail -n +2 sweepstake/data/results.csv    | wc -l | tr -d ' ')
            SCORERS=$(tail -n +2 sweepstake/data/topscorers.csv | wc -l | tr -d ' ')
            TEAMS=$(tail -n +2   sweepstake/data/teams.csv      | wc -l | tr -d ' ')
            git commit -m "⚽ WC2026: ${MATCHES} results, ${SCORERS} scorers, ${TEAMS} teams [skip ci]"
            git push
            echo "Pushed updated data"
          fi
